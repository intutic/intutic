[tool.poetry]
name = "intutic-clawde"
version = "1.10.0"
description = "Programmatic proxy connection wrappers and warm-path budget gates for Intutic"
authors = ["Intutic <engineering@intutic.ai>"]
readme = "README.md"
packages = [{include = "intutic_clawde"}]

[tool.poetry.dependencies]
# 3.9 reached end of life in October 2025. The patched releases of requests and
# urllib3 below both require >=3.10, so supporting 3.9 means shipping known CVEs.
python = "^3.10"
requests = "^2.33.0"
urllib3 = ">=2.7.0"
# The gate's image-integrity tier parses the Kubernetes manifests a deploy
# command references; see intutic_clawde/gate/imagecheck.py.
pyyaml = "^6.0"
# Wave 1 framework adapters (intutic_clawde/gate/adapters/) — each import is
# guarded (`try: import ... except ImportError`), so intutic-clawde installs
# and runs with NONE of these present; a framework is only required to
# INSTANTIATE its adapter. LangGraph/CrewAI/AutoGen/AG2/Pydantic AI/
# smolagents need no entry here: their tools are plain callables/duck-typed
# objects the framework-agnostic @guard/guard_tools already governs, so they
# have no optional import to declare (crewai's below is for its OWN adapter
# module, adapters/crewai.py, which uses crewai's newer hook API directly).
langchain = {version = ">=1.0", optional = true}
crewai = {version = ">=1.15.3", optional = true}
google-adk = {version = ">=2.7.1", optional = true}
openai-agents = {version = "*", optional = true}

[tool.poetry.extras]
langchain = ["langchain"]
crewai = ["crewai"]
google-adk = ["google-adk"]
openai-agents = ["openai-agents"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
