[tool.poetry]
name = "intutic-clawde"
version = "1.10.0"
description = "Programmatic proxy connection wrappers and warm-path budget gates for Intutic"
authors = ["Intutic <engineering@intutic.ai>"]
readme = "README.md"
packages = [{include = "intutic_clawde"}]

[tool.poetry.dependencies]
# 3.9 reached end of life in October 2025. The patched releases of requests and
# urllib3 below both require >=3.10, so supporting 3.9 means shipping known CVEs.
python = "^3.10"
requests = "^2.33.0"
urllib3 = ">=2.7.0"
# The gate's image-integrity tier parses the Kubernetes manifests a deploy
# command references; see intutic_clawde/gate/imagecheck.py.
pyyaml = "^6.0"
# Wave 1/2 framework adapters (intutic_clawde/gate/adapters/) — each import is
# guarded (`try: import ... except ImportError`), so intutic-clawde installs
# and runs with NONE of these present; a framework is only required to
# INSTANTIATE its adapter. LangGraph needs no entry here: its tools are plain
# callables/duck-typed objects the framework-agnostic @guard/guard_tools
# already governs, so it has no optional import to declare.
langchain = {version = ">=1.0", optional = true}
# crewai caps its own Python support at <3.14; without an explicit upper
# bound here, Poetry's solver rejects it outright because this project
# declares support up to <4.0 and refuses an optional dep that can't cover
# the full declared range — independent of which Python actually runs CI.
crewai = {version = ">=1.15.3", optional = true, python = ">=3.10,<3.14"}
google-adk = {version = ">=2.7.1", optional = true}
openai-agents = {version = "*", optional = true}
# Wave 2 additions below. Checked live against PyPI's `requires_python` for
# each (`curl -s https://pypi.org/pypi/<pkg>/json | ...['info']['requires_python']`)
# before adding — the exact check Wave 1's crewai bug (see above) should have
# had from the start. All four report ">=3.10" with NO upper bound at the
# versions installed while building this adapter (autogen-agentchat/-core/-ext
# 0.7.5, ag2 1.0.2, pydantic-ai-slim 2.31.1, smolagents 1.26.0) — unlike
# crewai, none of them needs an explicit `python = "..."` constraint for
# Poetry's solver to accept the full ^3.10 range this project declares.
autogen-agentchat = {version = ">=0.7.5", optional = true}
autogen-core = {version = ">=0.7.5", optional = true}
autogen-ext = {version = ">=0.7.5", optional = true}
ag2 = {version = ">=1.0.2", optional = true}
pydantic-ai-slim = {version = ">=2.31.1", optional = true}
smolagents = {version = ">=1.26.0", optional = true}
# A4 (AWS Strands Agents). Same live PyPI `requires_python` check as Wave 2:
# strands-agents reports ">=3.10" with NO upper bound at 1.52.0 (the version
# installed while building this adapter), so — unlike crewai above — it needs
# no explicit `python = "..."` constraint for Poetry's solver to accept the
# full ^3.10 range this project declares.
strands-agents = {version = ">=1.52.0", optional = true}

[tool.poetry.extras]
langchain = ["langchain"]
crewai = ["crewai"]
google-adk = ["google-adk"]
openai-agents = ["openai-agents"]
autogen = ["autogen-agentchat", "autogen-core", "autogen-ext"]
ag2 = ["ag2"]
pydantic-ai = ["pydantic-ai-slim"]
smolagents = ["smolagents"]
strands = ["strands-agents"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
# Dev-only, for tests/test_adapter_managed_agents.py: constructs real
# anthropic.types.beta.sessions event models to check managed_agents.py's
# duck-typed field reads against the actual shipped shapes. Not a runtime
# dependency of the adapter itself (see managed_agents.py's module doc: it
# duck-types `client`/event objects rather than importing `anthropic`), so —
# unlike the optional adapters above — this carries no risk to the `^3.10`
# extras-resolution incident: it is not `optional = true` and not part of any
# extra. PyPI reports `anthropic==0.122.0` (the version installed while
# building this adapter) as `Requires-Python: >=3.9`, no upper bound, so it
# needs no explicit `python = "..."` constraint either way.
anthropic = ">=0.122.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
