# Grammar version pins — update via scripts/update-grammars.sh
# Tags used for human readability; full commit SHAs used for reproducibility.
# sha field accepts either a tag (e.g. v0.23.6) or a full commit SHA.
#
# subdir: if set, tree-sitter build --wasm is run from <repo_root>/<subdir>
#         (required for tree-sitter-typescript which stores grammar in typescript/)
#
# wasm_status:
#   "verified"    — WASM loads correctly under our wasmtime version
#   "best-effort" — C external scanner known to be unstable; fallback to regex
#   "failed"      — confirmed failure; regex is the only path
#
# To update a grammar:
#   1. Run: bash scripts/update-grammars.sh       (shows available updates)
#   2. Run: bash scripts/update-grammars.sh --bump <lang>  (bumps the SHA)
#   3. Run: bash scripts/download-grammars.sh     (rebuilds .wasm)
#   4. Run: cargo test snip
#   5. Commit GRAMMAR_PINS.toml + updated .wasm LFS pointer
#
[grammars]
# sha is the commit itself, verified to be what the tag comment names —
# these fields used to hold the mutable tag string with the real commit only
# in a comment beside it, so "pinned to a commit SHA" was true of the
# document's prose and false of what download-grammars.sh actually fetched.
python     = { repo = "tree-sitter/tree-sitter-python",     sha = "bffb65a8cfe4e46290331dfef0dbf0ef3679de11", wasm_status = "verified" } # v0.23.6

# subdir required: grammar lives in tree-sitter-typescript/typescript/
typescript = { repo = "tree-sitter/tree-sitter-typescript", sha = "f975a621f4e7f532fe322e13c4f79495e0a7b2e7", subdir = "typescript", wasm_status = "best-effort" } # v0.23.2

javascript = { repo = "tree-sitter/tree-sitter-javascript", sha = "3a837b6f3658ca3618f2022f8707e29739c91364", wasm_status = "verified" } # v0.23.1

go         = { repo = "tree-sitter/tree-sitter-go",         sha = "3c3775faa968158a8b4ac190a7fda867fd5fb748", wasm_status = "verified" } # v0.23.4

java       = { repo = "tree-sitter/tree-sitter-java",       sha = "94703d5a6bed02b98e438d7cad1136c01a60ba2c", wasm_status = "verified" } # v0.23.5
