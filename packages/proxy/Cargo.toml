[package]
name = "intutic-proxy"
version = "1.6.0"
edition = "2021"
authors = ["Intutic <eng@intutic.dev>"]
description = "High-performance AI agent proxy with WebAssembly-based governance policies"
license = "MIT"

[lib]
name = "intutic_proxy"
path = "src/lib.rs"

[[bin]]
name = "intutic-proxy"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros", "http2"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# HTTP client for upstream LLM providers
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }

# WASM runtime
#
# Held at >=36: RUSTSEC/GHSA advisories against 29 cover out-of-sandbox loads
# from the `f64.copysign` and `f64x2.splat` lowerings on x86-64 (fixed 36.0.5 /
# 36.0.7). Those are Cranelift codegen bugs, and Cranelift is the backend we
# use, so they are reachable from any rule we execute. 36 also clears the
# Winch, component-model and WASI advisories, none of which we were exposed to.
# wasmtime-wasi is used only by benches/wasm_bench.rs, never by shipped code.
wasmtime = "36"
wasmtime-wasi = "36"


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Redis/Valkey client
redis = { version = "0.25", features = ["aio", "tokio-comp", "connection-manager"] }

# Regex for DLP scanner
regex = "1"

# Code skeleton extraction — Rust AST (snip_code.rs)
syn = { version = "2.0", features = ["parsing", "full"] }

# Code skeleton extraction — multi-language via tree-sitter WASM grammars
# Grammars are embedded via include_bytes! at compile time (see assets/grammars/)
#
# The `wasm` feature pulls wasmtime-c-api-impl, i.e. a SECOND wasmtime entirely
# separate from the one above. 0.24 pinned that to wasmtime 25, which carried
# the same advisories and would have kept them open no matter what the direct
# dependency said. 0.26 moved it to wasmtime-c-api-impl ^36.0.12, which is why
# this bump is part of the security fix rather than routine maintenance.
tree-sitter = { version = "0.26", features = ["wasm"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Held at >=0.32.1: opentelemetry_sdk 0.24 allocates without bound while parsing
# W3C Baggage headers, which are attacker-controlled on any inbound request.
# These four move as a set — otlp 0.32 requires sdk 0.32, and
# tracing-opentelemetry 0.33 is the first release built against otel 0.32.
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
# The tonic transport feature was renamed "tonic" -> "grpc-tonic"; the separate
# "tokio" feature no longer exists.
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"

# Misc
uuid = { version = "1", features = ["v4"] }
nanoid = "0.4"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
once_cell = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
tokio-stream = "0.1"
futures-util = "0.3"

# Phase 7: Token Intelligence (LLD #47)
tiktoken-rs = "0.6"
# TLS MITM for Windsurf Cascade AI governance
rcgen = { version = "0.13", features = ["pem"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
# Integration tests (tests/reward_test.rs) talk to Valkey directly
redis = { version = "0.25", features = ["aio", "tokio-comp", "connection-manager"] }
# Integration tests (tests/wasm_local_test.rs) compile minimal WAT rule fixtures
wat = "1"
# Must track the runtime dependency above. Left at 29 this pulled a whole second
# vulnerable wasmtime into the lockfile, which Dependabot flags on Cargo.lock
# regardless of it being test-only.
wasmtime = "36"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "snip_bench"
harness = false

[[bench]]
name = "policy_bench"
harness = false

[[bench]]
name = "policy_e2e_bench"
harness = false

[[bench]]
name = "wasm_bench"
harness = false
