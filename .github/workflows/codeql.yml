name: CodeQL Security Analysis

on:
  # Every PR is analysed here; main is analysed by the weekly schedule and on
  # demand. A `push: main` trigger ran the same analysis a second time on
  # every merge — 19–29 job-minutes per merge that found nothing the PR run
  # had not — while the org's Actions budget was being hit in a day of normal
  # merging.
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

# A new push to a PR supersedes the analysis of the previous one.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # A PR is analysed only in the languages it can change. The Rust analysis
  # takes ~20 minutes and most PRs touch no Rust, so it runs when a Rust input
  # changed (any .rs file, the proxy crate, Cargo files, the toolchain, this
  # workflow). The JavaScript/TypeScript analysis runs unless the PR changes
  # nothing but .md/.txt files. A PR that changes only docs runs neither.
  # The weekly schedule and manual runs analyse both; when the diff cannot be
  # computed, both run (fail open to analysing).
  languages:
    name: Choose languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          js='{"language":"javascript-typescript","build-mode":"none"}'
          rust='{"language":"rust","build-mode":"none"}'
          langs=()
          if [ "$EVENT" != "pull_request" ] || ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            langs=("$js" "$rust")
          else
            if printf '%s\n' "$changed" | grep -qvE '\.(md|txt)$'; then langs+=("$js"); fi
            if printf '%s\n' "$changed" | grep -vE '\.(md|txt)$' | grep -qE '\.rs$|^packages/proxy/|(^|/)Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^\.github/workflows/codeql\.yml$'; then langs+=("$rust"); fi
          fi
          matrix="{\"include\":[$(IFS=,; echo "${langs[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Analysing: $matrix"

  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Rust C/Build dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Pre-build Cargo dependencies & generated code for CodeQL extraction
        if: matrix.language == 'rust'
        run: |
          cargo check --workspace --all-targets --all-features

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
