# ─────────────────────────────────────────────────────────────
# publish-image.yml — the public proxy container image
# ─────────────────────────────────────────────────────────────
#
# Builds the open-core proxy (packages/proxy/Dockerfile: standalone, no
# control-plane clients) for linux/amd64 and linux/arm64, each on a runner of
# that architecture (the Rust build would take hours under QEMU), and publishes
# it as ghcr.io/intutic/intutic-proxy:<version>, plus :latest when the version
# is the highest release. Every platform image is started and must answer
# /health with its own version before the tag is written. The multi-platform
# index carries a GitHub build provenance attestation:
#   gh attestation verify oci://ghcr.io/intutic/intutic-proxy:<version> --owner intutic
#
# Triggered by:
#   1. a v* tag (the release; publish.yml runs on the same tag);
#   2. by hand, for an existing tag (workflow_dispatch, tag: v3.2.1);
#   3. a pull request that changes the Dockerfile or this file: build and
#      health check only, nothing pushed.
#
# Not the image Intutic runs: ghcr.io/intutic/proxy (private, built in the
# enterprise repository) carries the control-plane clients.
# ─────────────────────────────────────────────────────────────

name: Proxy Container Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v3.2.1"
        required: true
  pull_request:
    branches: [main]
    paths:
      - packages/proxy/Dockerfile
      - packages/proxy/.dockerignore
      - .github/workflows/publish-image.yml

concurrency:
  group: publish-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/intutic/intutic-proxy

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.v.outputs.ref }}
      version: ${{ steps.v.outputs.version }}
      push: ${{ steps.v.outputs.push }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # every tag, to tell whether this one is the newest

      - name: Read the version and check it against the crate
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          crate="$(grep -m1 '^version' packages/proxy/Cargo.toml | cut -d'"' -f2)"
          if [ "$EVENT" = pull_request ]; then
            { echo "ref=$GITHUB_SHA"; echo "version=$crate"; echo "push=false"; echo "latest=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$tag is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          version="${tag#v}"
          if [ "$crate" != "$version" ]; then
            echo "::error file=packages/proxy/Cargo.toml::version $crate != tag $tag"; exit 1
          fi
          # :latest only for the highest release; a pre-release or an older tag never takes it.
          newest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          latest=false; [ "$tag" = "$newest" ] && latest=true
          { echo "ref=refs/tags/$tag"; echo "version=$version"; echo "push=true"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"
          echo "$tag: version $version, latest=$latest"

  build:
    name: Build (${{ matrix.arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ needs.meta.outputs.ref }}
      VERSION: ${{ needs.meta.outputs.version }}
      PUSH: ${{ needs.meta.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.ref }}
          lfs: true   # the proxy embeds LFS-stored grammar files; pointers fail its build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # Docker Hub rate-limits unauthenticated pulls from shared runners; base
        # images come through Google's mirror of it, the same content by digest.
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: needs.meta.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release pushes by digest only: the version tag goes on the
      # multi-platform index the publish job makes, after both images passed.
      - name: Build the image
        id: build
        run: |
          set -euo pipefail
          common=(--platform "linux/${{ matrix.arch }}" -f packages/proxy/Dockerfile
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.licenses=MIT")
          if [ "$PUSH" = true ]; then
            docker buildx build "${common[@]}" --sbom=true --provenance=mode=max \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/meta.json" packages/proxy
            digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
            mkdir -p "$RUNNER_TEMP/digests" && printf '%s' "$digest" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
            ref="$IMAGE@$digest"
            docker pull -q "$ref"
          else
            docker buildx build "${common[@]}" --load -t intutic-proxy:test packages/proxy
            ref=intutic-proxy:test
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: The image starts and reports ${{ needs.meta.outputs.version }}
        env:
          REF_IMAGE: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          docker run -d --name proxy -p 4000:4000 "$REF_IMAGE" > /dev/null
          for _ in $(seq 1 30); do
            if body="$(curl -fsS http://localhost:4000/health 2>/dev/null)"; then
              got="$(printf '%s' "$body" | jq -r .version)"
              if [ "$got" = "$VERSION" ]; then echo "$body"; exit 0; fi
              echo "::error::the image reports version $got, not $VERSION"; docker logs proxy; exit 1
            fi
            sleep 2
          done
          echo "::error::no answer on /health within 60 s"; docker logs proxy; exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.meta.outputs.push == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          retention-days: 1

  publish:
    name: Tag and attest
    needs: [meta, build]
    if: needs.meta.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      LATEST: ${{ needs.meta.outputs.latest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures under the version
        id: index
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/digests"
          tags=(-t "$IMAGE:$VERSION")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          # GHCR shows the index's annotations on the package page.
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=Intutic open-core proxy: policy as code for AI agents, enforced at the tool call" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            "$IMAGE@$(cat "$d/amd64")" "$IMAGE@$(cat "$d/arm64")"
          index="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          platforms="$(docker buildx imagetools inspect "$IMAGE@$index" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(",")')"
          [ "$platforms" = "amd64,arm64" ] || { echo "::error::$IMAGE:$VERSION holds $platforms, not amd64,arm64"; exit 1; }
          echo "digest=$index" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION = $IMAGE@$index (latest=$LATEST)"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
