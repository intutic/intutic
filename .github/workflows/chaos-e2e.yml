# ─────────────────────────────────────────────────────────────
# chaos-e2e.yml — agent chaos engineering, end to end in the sandbox
# ─────────────────────────────────────────────────────────────
#
# Runs tools/scripts/chaos-e2e.sh: the real `intutic chaos run`, the real
# proxy binary and the built MCP proxy, a stub agent harness that calls the
# emitted Claude Code gate, all inside the OCI sandbox (Node image). Every
# MCP-proxy and gate fault runs against a resilient and a fragile harness and
# each JSON report is checked: verdict, score, fault_injected per fault,
# plan_loaded per component, probe outcomes.
#
# Runs when the code that injects, records or scores a fault changes, or the
# sandbox it runs in, or the suite itself.
# ─────────────────────────────────────────────────────────────

name: Chaos e2e

on:
  push:
    branches: [main]
    paths: &chaos_paths
      - "packages/proxy/src/chaos.rs"
      - "packages/mcp-proxy/src/chaos.ts"
      - "packages/mcp-proxy/src/proxy.ts"
      - "packages/shared-types/src/chaos.ts"
      - "packages/shared-types/src/chaosGate.ts"
      - "packages/intutic-clawde/intutic_clawde/gate/chaos.py"
      - "services/sync-daemon/src/harness/gateBody.ts"
      - "services/sync-daemon/src/harness/claudeCodeHooks.ts"
      - "services/sync-daemon/src/lib/chaosPy.ts"
      - "tools/cli/src/commands/chaos.ts"
      - "tools/cli/src/lib/chaos/**"
      - "tools/cli/src/lib/sandbox/**"
      - "tools/cli/resources/**"
      - "tools/cli/chaos-e2e/**"
      - "tools/scripts/chaos-e2e.sh"
      - ".github/workflows/chaos-e2e.yml"
  pull_request:
    paths: *chaos_paths
  workflow_dispatch:

concurrency:
  group: chaos-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  chaos-e2e:
    name: Chaos e2e (MCP-proxy and gate faults in the sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A debug build is all the suite needs; no debug info keeps it small and
      # quick to link.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true   # the proxy embeds LFS-stored grammar files; pointers fail its build

      - name: Install pnpm
        run: npm install -g pnpm@11.6.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry and the proxy build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-chaos-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-chaos-e2e-

      # The sandbox image is FROM alpine. Shared runners hit Docker Hub's
      # unauthenticated rate limit, so it comes through Google's mirror of
      # Docker Hub (the same content) and is tagged with the name the
      # Dockerfile uses; the build then finds it locally.
      - name: Pull the sandbox base image
        run: |
          docker pull -q mirror.gcr.io/library/alpine:3.20
          docker tag mirror.gcr.io/library/alpine:3.20 alpine:3.20

      - name: Run the chaos e2e suite
        env:
          CHAOS_E2E_WORK: ${{ runner.temp }}/chaos-e2e
        run: tools/scripts/chaos-e2e.sh

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chaos-e2e-reports
          path: |
            ${{ runner.temp }}/chaos-e2e/reports
            ${{ runner.temp }}/chaos-e2e/*.log
          retention-days: 14
