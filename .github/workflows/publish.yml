# ─────────────────────────────────────────────────────────────
# publish.yml — Full CI/CD Multi-Platform Build & Release Pipeline
# ─────────────────────────────────────────────────────────────
#
# Triggered by:
#   1. Push of a version tag (e.g. v1.5.0)
#   2. Manual workflow_dispatch
#
# Automated Outputs:
#   1. Publishes all 8 npm packages (shared-types, id, logger, clawde-sdk,
#      sync-daemon, mcp-governance-proxy, proxy, cli)
#   2. Builds multi-platform Rust proxy binaries (macOS arm64/x64, Linux x64/arm64, Windows x64)
#   3. Packages standalone CLI executables (macOS arm64/x64, Linux x64, Windows x64)
#   4. Automatically creates GitHub Release with attached binaries and npm tarballs
# ─────────────────────────────────────────────────────────────

name: Release Pipeline & Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish and release)"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Gate: a tag that disagrees with the manifests would publish eight packages
  # at the wrong version and cut a GitHub Release whose assets do not match its
  # name. Fail before anything is pushed, not after.
  verify-versions:
    name: Verify Tag Matches Package Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare tag against every published manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG"
          fail=0
          for pkg in packages/shared-types packages/id packages/logger \
                     packages/clawde-sdk services/sync-daemon packages/mcp-proxy \
                     packages/proxy tools/cli; do
            actual="$(node -p "require('./$pkg/package.json').version")"
            if [ "$actual" != "$TAG" ]; then
              echo "::error file=$pkg/package.json::version $actual != tag $TAG"
              fail=1
            fi
          done
          crate="$(grep -m1 '^version' packages/proxy/Cargo.toml | cut -d'"' -f2)"
          if [ "$crate" != "$TAG" ]; then
            echo "::error file=packages/proxy/Cargo.toml::version $crate != tag $TAG"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Refusing to publish: tag and manifests disagree."
            exit 1
          fi
          echo "✅ All manifests match $TAG"

  # npm goes LAST, after the GitHub Release exists.
  #
  # tools/cli ships a launcher (packages/proxy/bin/proxy.js) that downloads its
  # native proxy binary from
  #   https://github.com/intutic/intutic/releases/download/v<version>/<asset>
  # on first run. When this job ran in parallel with the binary builds,
  # @intutic/cli was live on npm tens of minutes before that release existed —
  # so every install during the window 404'd on first run. Depending on
  # github-release closes that window: by the time the package is installable,
  # the assets it reaches for are already published.
  #
  # It also waits on smoke-test-linux, so a binary that cannot start on the
  # oldest supported distro blocks the publish rather than being discovered
  # afterwards. npm versions cannot be recalled; a GitHub Release can be
  # deleted, so failing here leaves the recoverable artefact published and the
  # unrecoverable one not.
  publish-npm:
    name: Publish npm Packages
    runs-on: ubuntu-latest
    needs: [verify-versions, github-release, smoke-test-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install pnpm
        run: npm install -g pnpm@11.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Verify no unrewritten workspace refs
        # Defence in depth for issue #1: @intutic/cli 1.4.0–1.5.0 shipped with
        # `workspace:*` dependencies, making `npm install -g @intutic/cli` fail
        # outright for three releases. Pack each package and inspect what would
        # actually reach the registry, rather than trusting the tooling.
        run: |
          set -euo pipefail
          fail=0
          tmp="$(mktemp -d)"
          for pkg in packages/shared-types packages/id packages/logger packages/clawde-sdk \
                     services/sync-daemon packages/mcp-proxy packages/proxy tools/cli; do
            (cd "$pkg" && pnpm pack --pack-destination "$tmp" >/dev/null)
          done
          for tgz in "$tmp"/*.tgz; do
            refs="$(tar xzOf "$tgz" package/package.json | grep -c '"workspace:' || true)"
            if [ "$refs" != "0" ]; then
              echo "::error::$(basename "$tgz") contains $refs unrewritten workspace: dependency"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "✅ No workspace: refs in any tarball"
          exit $fail

      - name: Publish All 8 Packages to npm
        # Order matters: @intutic/logger and @intutic/sync-daemon are runtime
        # dependencies of @intutic/cli (and logger of @intutic/mcp-governance-proxy).
        # pnpm rewrites `workspace:*` to the concrete version at publish time, so
        # they must exist on npm or `npm i -g @intutic/cli` fails with E404.
        #
        # A failed publish must FAIL the job. The previous `|| echo "may already
        # be published"` swallowed auth errors, build errors, and version
        # conflicts alike, so the pipeline reported success while shipping
        # nothing. An already-published version is the one tolerable case, and it
        # is confirmed against the registry rather than assumed.
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          for pkg in packages/shared-types packages/id packages/logger packages/clawde-sdk services/sync-daemon packages/mcp-proxy packages/proxy tools/cli; do
            name="$(node -p "require('./$pkg/package.json').name")"
            version="$(node -p "require('./$pkg/package.json').version")"
            echo "📦 Publishing $name@$version ..."
            if (cd "$pkg" && pnpm publish --no-git-checks --access public); then
              echo "✅ Published $name@$version"
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "ℹ️  $name@$version already on npm — skipping"
            else
              echo "::error::Failed to publish $name@$version and it is not on npm"
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run — skipped publish
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true — build and pack verified, no packages published."

  build-rust-proxy:
    name: Build Native Rust Proxy (${{ matrix.target }})
    needs: verify-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: intutic-proxy-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: intutic-proxy-darwin-x64
          # Artifact names MUST match the asset names the CLI requests in
          # tools/cli/src/commands/connect.ts (…-linux-x64, not -amd64).
          #
          # Pinned to 22.04, NOT ubuntu-latest. glibc is backward but not
          # forward compatible: a binary linked on a newer glibc demands that
          # version at runtime. `ubuntu-latest` moved to 24.04 (glibc 2.39), so
          # v1.6.0's Linux binaries required GLIBC_2.38 and died on start with
          # "version `GLIBC_2.38' not found" on Debian 12 (2.36), Ubuntu 22.04
          # (2.35) and RHEL 9 — see issue #1. 22.04 gives glibc 2.35, which runs
          # on every one of those. Do not change this to ubuntu-latest.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: intutic-proxy-linux-x64
          # Native arm64 runner — avoids cross-compiling wasmtime/ring. Same
          # glibc-floor reasoning as above.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            artifact_name: intutic-proxy-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: intutic-proxy-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Proxy Binary
        run: cargo build --release --target ${{ matrix.target }} --package intutic-proxy
        working-directory: .
      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p dist-release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/intutic-proxy.exe dist-release/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/intutic-proxy dist-release/${{ matrix.artifact_name }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/${{ matrix.artifact_name }}

  build-cli-binaries:
    # `pkg` cross-builds every target in one invocation, so this job has no
    # matrix — an earlier ${{ matrix.target_os }} here rendered as an empty
    # "( )" in the job name.
    name: Package Standalone CLI Binaries (all targets)
    runs-on: ubuntu-latest
    needs: verify-versions
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Install pnpm
        run: npm install -g pnpm@11.6.0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies & compile CLI standalone binaries
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build
          mkdir -p dist-cli
          npx pkg tools/cli/package.json --targets node18-macos-arm64,node18-macos-x64,node18-linux-x64,node18-win-x64 --out-path dist-cli
          mv dist-cli/cli-macos-arm64 dist-cli/cli-macos-arm64 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: cli-standalone-binaries
          path: dist-cli/*

  github-release:
    name: Create GitHub Release & Upload Assets
    # Deliberately does NOT depend on publish-npm — the dependency runs the
    # other way now, so the release assets land before the CLI is installable.
    needs: [build-rust-proxy, build-cli-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Install pnpm
        run: npm install -g pnpm@11.6.0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies & build tarballs
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build
          mkdir -p release-assets
          # MUST be `pnpm pack`, not `npm pack`. npm does not understand the
          # `workspace:` protocol and leaves `workspace:*` verbatim in the packed
          # package.json; pnpm rewrites it to the concrete version. Release
          # tarballs built with npm shipped `"@intutic/id": "workspace:*"`, which
          # fails any install with EUNSUPPORTEDPROTOCOL (see issue #1).
          for pkg in packages/shared-types packages/id packages/logger packages/clawde-sdk \
                     services/sync-daemon packages/mcp-proxy packages/proxy tools/cli; do
            (cd $pkg && pnpm pack --pack-destination ../../release-assets)
          done

      - name: Download All Compiled Binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} release-assets/* \
            --title "Release ${{ github.ref_name }}" \
            --notes "Official release ${{ github.ref_name }} including multi-platform precompiled Rust proxy binaries, standalone CLI executables, and npm package tarballs." \
            || gh release upload ${{ github.ref_name }} release-assets/* --clobber

  # ── Old-glibc smoke test ────────────────────────────────────────────────────
  #
  # Runs the binary we are about to ship inside Debian 12 and fails if it cannot
  # start. This exists because nothing else in this pipeline can catch a glibc
  # regression: every job builds AND tests on the runner's own glibc, so a binary
  # linked too high looks perfectly healthy right up until a user runs it.
  #
  # That is exactly how v1.6.0 shipped broken. `ubuntu-latest` moved to Ubuntu
  # 24.04 (glibc 2.39), the Linux binaries started demanding GLIBC_2.38, CI was
  # green throughout, and the first sign of trouble was issue #1 —
  #   /root/.intutic/bin/intutic-proxy: /lib/x86_64-linux-gnu/libc.so.6:
  #   version `GLIBC_2.38' not found
  # on Debian 12 (glibc 2.36), plus Ubuntu 22.04 LTS, RHEL 9 and Amazon Linux
  # 2023. Pinning the build matrix to 22.04 fixed it; this job is what stops it
  # from silently coming back the next time someone "modernizes" a runner label.
  #
  # Debian 12 is the floor we test because it is the oldest distro we claim to
  # support. Each arch runs on its own native runner rather than under QEMU, so
  # a failure here means a real failure rather than an emulation artefact.
  smoke-test-linux:
    name: Smoke Test Linux Binary on Debian 12 (${{ matrix.arch }})
    needs: github-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
            asset: intutic-proxy-linux-x64
          - arch: arm64
            os: ubuntu-22.04-arm
            asset: intutic-proxy-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # The artifact is byte-identical to the asset uploaded to the release —
      # github-release downloads these same artifacts and uploads them verbatim.
      # Pulling the artifact rather than the release URL means this also runs on
      # a dry run, where no release exists, so a glibc regression is caught in
      # the rehearsal instead of after the packages are public.
      - name: Download the binary that is about to ship
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: smoke/

      - name: Run it on Debian 12
        run: |
          set -euo pipefail
          BIN="smoke/${{ matrix.asset }}"
          # upload-artifact does not preserve the executable bit.
          chmod +x "$BIN"

          echo "Binary: $(file -b "$BIN")"
          echo "Highest glibc symbol required:"
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true

          # The proxy exits non-zero here because the container has no config
          # file — that is fine and expected. What matters is that it gets far
          # enough to print its own startup line, which means the dynamic linker
          # was satisfied. `|| true` keeps that expected exit from failing the
          # step before the assertions below run.
          out="$(docker run --rm -v "$PWD/smoke:/smoke:ro" debian:12 \
                   "/smoke/${{ matrix.asset }}" 2>&1 | head -20 || true)"
          echo "--- output ---"
          echo "$out"
          echo "--------------"

          if grep -qiE "GLIBC_[0-9.]+' not found|error while loading shared libraries|cannot execute binary file|Exec format error" <<<"$out"; then
            echo "::error::${{ matrix.asset }} cannot start on Debian 12 — glibc floor regression. Check the runner images in the build-rust-proxy matrix; they must stay at 22.04."
            exit 1
          fi

          # Positive assertion, not just absence of known errors: require the
          # app's own first log line. A binary that dies for some new reason
          # would otherwise slip through the grep above.
          if ! grep -q "Intutic Proxy Gateway starting" <<<"$out"; then
            echo "::error::${{ matrix.asset }} did not reach startup on Debian 12. It may run on the build runner but not on the oldest supported distro."
            exit 1
          fi

          echo "✅ ${{ matrix.asset }} starts on Debian 12 (glibc $(docker run --rm debian:12 sh -c 'ldd --version | head -1' | grep -oE '[0-9]+\.[0-9]+$'))"
