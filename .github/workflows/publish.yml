# ─────────────────────────────────────────────────────────────
# publish.yml — Full CI/CD Multi-Platform Build & Release Pipeline
# ─────────────────────────────────────────────────────────────
#
# Triggered by:
#   1. Push of a version tag (e.g. v1.5.0)
#   2. Manual workflow_dispatch
#
# Automated Outputs:
#   1. Publishes all 9 npm packages (anomaly-taxonomy, shared-types, id, logger, clawde-sdk,
#      sync-daemon, mcp-governance-proxy, proxy, cli)
#   2. Builds multi-platform Rust proxy binaries (macOS arm64/x64, Linux x64/arm64, Windows x64)
#   3. Packages standalone CLI executables (macOS arm64/x64, Linux x64, Windows x64)
#   4. Automatically creates GitHub Release with attached binaries and npm tarballs
# ─────────────────────────────────────────────────────────────

name: Release Pipeline & Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish and release)"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Gate: a tag that disagrees with the manifests would publish eight packages
  # at the wrong version and cut a GitHub Release whose assets do not match its
  # name. Fail before anything is pushed, not after.
  verify-versions:
    name: Verify Tag Matches Package Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Compare tag against every published manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG"
          fail=0
          for pkg in packages/anomaly-taxonomy packages/shared-types packages/id packages/logger \
                     packages/clawde-sdk services/sync-daemon packages/mcp-proxy \
                     packages/proxy tools/cli; do
            actual="$(node -p "require('./$pkg/package.json').version")"
            if [ "$actual" != "$TAG" ]; then
              echo "::error file=$pkg/package.json::version $actual != tag $TAG"
              fail=1
            fi
          done
          crate="$(grep -m1 '^version' packages/proxy/Cargo.toml | cut -d'"' -f2)"
          if [ "$crate" != "$TAG" ]; then
            echo "::error file=packages/proxy/Cargo.toml::version $crate != tag $TAG"
            fail=1
          fi
          # publish-pypi.yml fires on the same v* tag and publishes whatever
          # version pyproject.toml declares. It was left out of this gate, and
          # drifted: the v1.8.0 tag would have published intutic-clawde 1.6.3.
          pyver="$(grep -m1 '^version' packages/intutic-clawde/pyproject.toml | cut -d'"' -f2)"
          if [ "$pyver" != "$TAG" ]; then
            echo "::error file=packages/intutic-clawde/pyproject.toml::version $pyver != tag $TAG"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Refusing to publish: tag and manifests disagree."
            exit 1
          fi
          echo "✅ All manifests match $TAG"

  # npm goes LAST, after the GitHub Release exists.
  #
  # tools/cli ships a launcher (packages/proxy/bin/proxy.js) that downloads its
  # native proxy binary from
  #   https://github.com/intutic/intutic/releases/download/v<version>/<asset>
  # on first run. When this job ran in parallel with the binary builds,
  # @intutic/cli was live on npm tens of minutes before that release existed —
  # so every install during the window 404'd on first run. Depending on
  # github-release closes that window: by the time the package is installable,
  # the assets it reaches for are already published.
  #
  # It also waits on smoke-test-linux, so a binary that cannot start on the
  # oldest supported distro blocks the publish rather than being discovered
  # afterwards. npm versions cannot be recalled; a GitHub Release can be
  # deleted, so failing here leaves the recoverable artefact published and the
  # unrecoverable one not.
  # Builds, packs, and verifies every package but holds no publish credential
  # at all. Split out of what is now the `publish-npm` job specifically so
  # that `pnpm install` + `pnpm turbo run build` — which run arbitrary
  # dependency-owned install/build-time code — never execute in the same job
  # as NPM_TOKEN. A compromised transitive dependency's install script can
  # still run here, but there is nothing here for it to steal; the token
  # lives only in the job below, which runs no dependency code at all.
  build-npm-packages:
    name: Build & Pack npm Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true

      - name: Install pnpm
        run: npm install -g pnpm@11.6.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Pack all 9 packages
        run: |
          set -euo pipefail
          mkdir -p npm-tarballs
          for pkg in packages/anomaly-taxonomy packages/shared-types packages/id packages/logger packages/clawde-sdk \
                     services/sync-daemon packages/mcp-proxy packages/proxy tools/cli; do
            (cd "$pkg" && pnpm pack --pack-destination ../../npm-tarballs >/dev/null)
          done

      - name: Verify no unrewritten workspace refs
        # Defence in depth for issue #1: @intutic/cli 1.4.0–1.5.0 shipped with
        # `workspace:*` dependencies, making `npm install -g @intutic/cli` fail
        # outright for three releases. Inspects the exact tarballs the publish
        # job will upload, rather than a separate pack nothing else ever sees.
        run: |
          set -euo pipefail
          fail=0
          for tgz in npm-tarballs/*.tgz; do
            refs="$(tar xzOf "$tgz" package/package.json | grep -c '"workspace:' || true)"
            if [ "$refs" != "0" ]; then
              echo "::error::$(basename "$tgz") contains $refs unrewritten workspace: dependency"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "✅ No workspace: refs in any tarball"
          exit $fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz

  # This job's only inputs are the already-built tarballs from
  # build-npm-packages and package.json (read-only, for name/version) — no
  # `pnpm install`, no build, no dependency code of any kind runs where
  # NPM_TOKEN is in scope.
  #
  # OIDC Trusted Publishing (no long-lived token at all) needs each of the 9
  # packages linked to this repo/workflow as a trusted publisher on
  # npmjs.com first — an account-level action outside what CI can do for
  # itself. NPM_TOKEN stays the mechanism until that one-time setup happens;
  # this split is what keeps it out of build-time code's reach in the
  # meantime.
  publish-npm:
    name: Publish npm Packages
    runs-on: ubuntu-latest
    needs: [build-npm-packages, verify-versions, github-release, smoke-test-linux]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Download packed tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-tarballs
          path: npm-tarballs/

      - name: Publish All 9 Packages to npm
        # Order matters: @intutic/logger and @intutic/sync-daemon are runtime
        # dependencies of @intutic/cli (and logger of @intutic/mcp-governance-proxy).
        # pnpm rewrites `workspace:*` to the concrete version at publish time, so
        # they must exist on npm or `npm i -g @intutic/cli` fails with E404.
        #
        # A failed publish must FAIL the job. The previous `|| echo "may already
        # be published"` swallowed auth errors, build errors, and version
        # conflicts alike, so the pipeline reported success while shipping
        # nothing. An already-published version is the one tolerable case, and it
        # is confirmed against the registry rather than assumed.
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          # anomaly-taxonomy first — shared-types depends on it, and publishing
          # a package whose dependency is not yet on the registry makes every
          # install of it fail until the second publish lands.
          for pkg in packages/anomaly-taxonomy packages/shared-types packages/id packages/logger packages/clawde-sdk services/sync-daemon packages/mcp-proxy packages/proxy tools/cli; do
            name="$(node -p "require('./$pkg/package.json').name")"
            version="$(node -p "require('./$pkg/package.json').version")"
            # pnpm/npm pack's own naming convention: @scope/name -> scope-name-version.tgz
            tarball_name="$(echo "$name" | sed 's/^@//; s/\//-/')-$version.tgz"
            tarball="npm-tarballs/$tarball_name"
            echo "📦 Publishing $name@$version ..."
            if [ ! -f "$tarball" ]; then
              echo "::error::expected tarball $tarball was not produced by build-npm-packages"
              exit 1
            fi
            if npm publish "$tarball" --access public; then
              echo "✅ Published $name@$version"
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "ℹ️  $name@$version already on npm — skipping"
            else
              echo "::error::Failed to publish $name@$version and it is not on npm"
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run — skipped publish
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true — build and pack verified, no packages published."

  build-rust-proxy:
    name: Build Native Rust Proxy (${{ matrix.target }})
    needs: verify-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: intutic-proxy-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: intutic-proxy-darwin-x64
          # Artifact names MUST match the asset names the CLI requests in
          # tools/cli/src/commands/connect.ts (…-linux-x64, not -amd64).
          #
          # Pinned to 22.04, NOT ubuntu-latest. glibc is backward but not
          # forward compatible: a binary linked on a newer glibc demands that
          # version at runtime. `ubuntu-latest` moved to 24.04 (glibc 2.39), so
          # v1.6.0's Linux binaries required GLIBC_2.38 and died on start with
          # "version `GLIBC_2.38' not found" on Debian 12 (2.36), Ubuntu 22.04
          # (2.35) and RHEL 9 — see issue #1. 22.04 gives glibc 2.35, which runs
          # on every one of those. Do not change this to ubuntu-latest.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: intutic-proxy-linux-x64
          # Native arm64 runner — avoids cross-compiling wasmtime/ring. Same
          # glibc-floor reasoning as above.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            artifact_name: intutic-proxy-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: intutic-proxy-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Proxy Binary
        run: cargo build --release --target ${{ matrix.target }} --package intutic-proxy
        working-directory: .
      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p dist-release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/intutic-proxy.exe dist-release/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/intutic-proxy dist-release/${{ matrix.artifact_name }}
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/${{ matrix.artifact_name }}

  build-cli-binaries:
    # `pkg` cross-builds every target in one invocation, so this job has no
    # matrix — an earlier ${{ matrix.target_os }} here rendered as an empty
    # "( )" in the job name.
    name: Package Standalone CLI Binaries (all targets)
    runs-on: ubuntu-latest
    needs: verify-versions
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true
      - name: Install pnpm
        run: npm install -g pnpm@11.6.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies & compile CLI standalone binaries
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build
          mkdir -p dist-cli
          pnpm exec pkg tools/cli/package.json --targets node18-macos-arm64,node18-macos-x64,node18-linux-x64,node18-win-x64 --out-path dist-cli
          mv dist-cli/cli-macos-arm64 dist-cli/cli-macos-arm64 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-standalone-binaries
          path: dist-cli/*

  github-release:
    name: Create GitHub Release & Upload Assets
    # Deliberately does NOT depend on publish-npm — the dependency runs the
    # other way now, so the release assets land before the CLI is installable.
    needs: [build-rust-proxy, build-cli-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true
      - name: Install pnpm
        run: npm install -g pnpm@11.6.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies & build tarballs
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build
          mkdir -p release-assets
          # MUST be `pnpm pack`, not `npm pack`. npm does not understand the
          # `workspace:` protocol and leaves `workspace:*` verbatim in the packed
          # package.json; pnpm rewrites it to the concrete version. Release
          # tarballs built with npm shipped `"@intutic/id": "workspace:*"`, which
          # fails any install with EUNSUPPORTEDPROTOCOL (see issue #1).
          for pkg in packages/anomaly-taxonomy packages/shared-types packages/id packages/logger packages/clawde-sdk \
                     services/sync-daemon packages/mcp-proxy packages/proxy tools/cli; do
            (cd $pkg && pnpm pack --pack-destination ../../release-assets)
          done

      - name: Download All Compiled Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets/
          merge-multiple: true

      # The npm launcher (packages/proxy/bin/proxy.js) and `intutic connect`
      # (tools/cli/src/commands/connect.ts) both download a per-platform
      # binary from this release directly and had no way to tell a genuine
      # asset from a swapped one — checksums.json, published alongside every
      # other asset in this same release, is what they verify against before
      # they chmod/spawn anything. Covers every asset in release-assets/, not
      # only the ones the two launchers currently check, so the manifest
      # itself never needs another asset added to it later.
      - name: Generate checksums.json for every release asset
        working-directory: release-assets
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const files = fs.readdirSync('.').sort();
            const checksums = {};
            for (const f of files) {
              const buf = fs.readFileSync(f);
              checksums[f] = 'sha256:' + crypto.createHash('sha256').update(buf).digest('hex');
            }
            fs.writeFileSync('checksums.json', JSON.stringify(checksums, null, 2) + '\n');
            console.log('checksums.json covers ' + files.length + ' asset(s):');
            for (const f of files) console.log('  ' + f + '  ' + checksums[f]);
          "

      # No --clobber: an asset name colliding with one already on the release
      # now fails the job instead of silently overwriting it — the exact gap
      # that made these releases mutable after publication. A build that
      # needs to replace a bad asset ships a new tag; it does not overwrite
      # the old one under the same version other installs may already trust.
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} release-assets/* \
            --title "Release ${{ github.ref_name }}" \
            --notes "Official release ${{ github.ref_name }} including multi-platform precompiled Rust proxy binaries, standalone CLI executables, and npm package tarballs." \
            || gh release upload ${{ github.ref_name }} release-assets/*

  # ── Old-glibc smoke test ────────────────────────────────────────────────────
  #
  # Runs the binary we are about to ship inside Debian 12 and fails if it cannot
  # start. This exists because nothing else in this pipeline can catch a glibc
  # regression: every job builds AND tests on the runner's own glibc, so a binary
  # linked too high looks perfectly healthy right up until a user runs it.
  #
  # That is exactly how v1.6.0 shipped broken. `ubuntu-latest` moved to Ubuntu
  # 24.04 (glibc 2.39), the Linux binaries started demanding GLIBC_2.38, CI was
  # green throughout, and the first sign of trouble was issue #1 —
  #   /root/.intutic/bin/intutic-proxy: /lib/x86_64-linux-gnu/libc.so.6:
  #   version `GLIBC_2.38' not found
  # on Debian 12 (glibc 2.36), plus Ubuntu 22.04 LTS, RHEL 9 and Amazon Linux
  # 2023. Pinning the build matrix to 22.04 fixed it; this job is what stops it
  # from silently coming back the next time someone "modernizes" a runner label.
  #
  # Debian 12 is the floor we test because it is the oldest distro we claim to
  # support. Each arch runs on its own native runner rather than under QEMU, so
  # a failure here means a real failure rather than an emulation artefact.
  smoke-test-linux:
    name: Smoke Test Linux Binary on Debian 12 (${{ matrix.arch }})
    needs: github-release
    # Defence in depth. This job once hung on a `head -N` that waited for output
    # a now-long-running process never produced, and with no bound that is six
    # hours of a blocked npm publish rather than a fast, obvious failure.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
            asset: intutic-proxy-linux-x64
          - arch: arm64
            os: ubuntu-22.04-arm
            asset: intutic-proxy-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # The artifact is byte-identical to the asset uploaded to the release —
      # github-release downloads these same artifacts and uploads them verbatim.
      # Pulling the artifact rather than the release URL means this also runs on
      # a dry run, where no release exists, so a glibc regression is caught in
      # the rehearsal instead of after the packages are public.
      - name: Download the binary that is about to ship
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.asset }}
          path: smoke/

      - name: Run it on Debian 12
        run: |
          set -euo pipefail
          BIN="smoke/${{ matrix.asset }}"
          # upload-artifact does not preserve the executable bit.
          chmod +x "$BIN"

          echo "Binary: $(file -b "$BIN")"
          echo "Highest glibc symbol required:"
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true

          # This test only asks one question: does the dynamic linker accept
          # this binary on the oldest supported distro? So it captures the
          # first few seconds of output and then stops the container, without
          # caring whether the process exits on its own.
          #
          # It used to pipe `docker run` straight into `head -20` and rely on
          # the proxy exiting because the container had no config file. Both
          # halves of that stopped being true: config became optional in 1.6.2,
          # and from 1.7.0 a missing Valkey falls back to standalone instead of
          # being fatal. The proxy now starts successfully, binds a port and
          # runs forever — so `head -20` waited for lines that never came and
          # the step hung until the job timeout, blocking the npm publish.
          #
          # Detached + logs + kill is indifferent to that: it works whether the
          # binary exits immediately, runs forever, or dies halfway.
          cid="$(docker run -d -v "$PWD/smoke:/smoke:ro" debian:12 \
                   "/smoke/${{ matrix.asset }}")"
          sleep 10
          out="$(docker logs "$cid" 2>&1 | head -40 || true)"
          docker rm -f "$cid" >/dev/null 2>&1 || true
          echo "--- output ---"
          echo "$out"
          echo "--------------"

          if grep -qiE "GLIBC_[0-9.]+' not found|error while loading shared libraries|cannot execute binary file|Exec format error" <<<"$out"; then
            echo "::error::${{ matrix.asset }} cannot start on Debian 12 — glibc floor regression. Check the runner images in the build-rust-proxy matrix; they must stay at 22.04."
            exit 1
          fi

          # Positive assertion, not just absence of known errors: require the
          # app's own first log line. A binary that dies for some new reason
          # would otherwise slip through the grep above.
          if ! grep -q "Intutic Proxy Gateway starting" <<<"$out"; then
            echo "::error::${{ matrix.asset }} did not reach startup on Debian 12. It may run on the build runner but not on the oldest supported distro."
            exit 1
          fi

          echo "✅ ${{ matrix.asset }} starts on Debian 12 (glibc $(docker run --rm debian:12 sh -c 'ldd --version | head -1' | grep -oE '[0-9]+\.[0-9]+$'))"
