# Keeps the SHA-pinned GitHub Actions in .github/workflows/*.yml current.
#
# Every third-party action reference in this repo is pinned to a full commit
# SHA (not a floating tag) so a compromised or malicious action release can't
# silently swap in — but a SHA pin that nothing ever bumps just freezes the
# repo on whatever commit it started at, including any bug or vulnerability
# already present there. This is the update side of that pin: Dependabot
# opens a PR bumping the SHA (with the version-tag comment kept current)
# whenever the pinned action publishes a new release, so the pin stays
# deliberate and reviewed rather than either mutable or stale.
#
# Version bumps are scoped to github-actions only. npm dependencies already
# have their own deliberate mechanism (pnpm's minimumReleaseAge cooldown) — an
# additional Dependabot version-bump flow for that ecosystem would duplicate
# or conflict with it rather than close a real gap.
#
# Security updates are the exception: Dependabot opens them for npm, pip and
# cargo whatever this file says, one pull request per package, each running
# the full CI. The entries below (open-pull-requests-limit: 0 keeps version
# updates off; security updates have their own limit) group them: one pull
# request per ecosystem and directory.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # github/codeql-action's init and analyze steps must run the same
      # version: the analyze post-step refuses a config file written by a
      # different init version ("Loaded a configuration file for version
      # '4.37.9', but running version '4.38.1'"). Separate per-action PRs
      # therefore always fail CodeQL; bump them as one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/packages/intutic-clawde"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directories: ["/", "/packages/proxy"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
