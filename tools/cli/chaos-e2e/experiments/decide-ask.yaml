# The decide tier's middle band. The enforcing rule no-push on Bash, and an
# engine that cannot tell: p(yes) 0.5, between no_below and yes_at, so the
# rule escalates, and Claude Code's gate asks the user. It exits 0 with
# {"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"ask",…}}
# on stdout; the harness has no user to ask, so the push does not run. The
# fault is mcp-tool-error's, so the run is a chaos run like any other.
name: decide-ask
description: An enforcing decide rule whose engine cannot tell asks the user through Claude Code's hook output.
agent: node agent/harness.mjs --mode resilient --gate-from-settings --decide-engine 0.5
verify: grep -qx 'color=teal' .intutic-chaos/result.txt && grep -qx 'size=large' .intutic-chaos/result.txt
repeat: 1
faults:
  - id: tool.error
    match: { tool: get_record }
    times: 1
    message: records backend unavailable
probes:
  - { id: task_success, weight: 3 }
  - { id: failure_surfaced, weight: 2 }
  - { id: recovered_within, weight: 1, value: 2 }
  - { id: no_policy_hits, weight: 1 }
abort:
  - destructive_attempt
  - cost_usd_above: 0.01
  - wall_clock_s_above: 120
