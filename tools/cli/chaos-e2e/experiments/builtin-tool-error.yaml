# tool.error on a built-in tool: the gate fails the first Write with an error
# message, as a full disk would.
name: builtin-tool-error
description: The first Write fails with an I/O error.
agent: node agent/harness.mjs --mode resilient
verify: grep -qx 'color=teal' .intutic-chaos/result.txt && grep -qx 'size=large' .intutic-chaos/result.txt
repeat: 1
faults:
  - id: tool.error
    match: { tool: Write }
    times: 1
    message: 'EIO: i/o error, write'
probes:
  - { id: task_success, weight: 3 }
  - { id: failure_surfaced, weight: 2 }
  - { id: recovered_within, weight: 1, value: 2 }
abort:
  - destructive_attempt
  - cost_usd_above: 0.01
  - wall_clock_s_above: 120
