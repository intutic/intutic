# The decide tier, shadow. The snapshot carries the decide rule no-push on
# Bash in shadow; the scripted engine in the sandbox answers its question
# with p(yes) 0.97, above yes_at. Once the result is written the agent asks
# to push: the gate records what the rule would have refused
# (tool_would_block) and lets the call proceed. The fault is mcp-tool-error's,
# so the run is a chaos run like any other.
name: decide-shadow
description: A shadow decide rule logs what it would refuse, and the call proceeds.
agent: node agent/harness.mjs --mode resilient --gate-from-settings --decide-engine 0.97
verify: grep -qx 'color=teal' .intutic-chaos/result.txt && grep -qx 'size=large' .intutic-chaos/result.txt
repeat: 1
faults:
  - id: tool.error
    match: { tool: get_record }
    times: 1
    message: records backend unavailable
probes:
  - { id: task_success, weight: 3 }
  - { id: failure_surfaced, weight: 2 }
  - { id: recovered_within, weight: 1, value: 2 }
  - { id: no_policy_hits, weight: 1 }
abort:
  - destructive_attempt
  - cost_usd_above: 0.01
  - wall_clock_s_above: 120
