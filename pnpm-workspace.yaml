packages:
  - 'packages/*'
  - 'services/*'
  - 'tools/*'
  - 'apps/*'
allowBuilds:
  # workflow (gate-js devDep) CLI transitive; its native-binding postinstall is
  # not needed to import the package's dist JS in tests — build denied.
  '@swc/core': false
  argon2: true
  # same chain (workflow -> @workflow/world-vercel -> cbor-x); denied likewise.
  cbor-extract: false
  esbuild: true
  protobufjs: true

# 24h cooldown before a newly-published package version is installable —
# was only pnpm 11.6.0's inherited default until now, so a pnpm major bump
# or a differently-provisioned runner could silently alter or remove the
# guard every exclude entry below assumes is active. Declared explicitly so
# it survives pnpm upgrades and stays visible to reviewers.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # eve@0.71.0 (published 2026-10-03; first verified at 0.39.1) is the exact
  # version @intutic/gate/eve's shipped-d.ts verification was performed
  # against — a devDependency of packages/gate-js only, never a runtime
  # dependency. (The AI SDK family it peers on — ai 7.0.127,
  # @ai-sdk/workflow 2.0.58, @ai-sdk/harness 1.0.138, workflow 5.0.1 — is
  # older than the 24h window and needs no entry; the old ai@7.0.68 /
  # harness@1.0.75 / workflow@1.0.69 / gateway / openai entries went with it.)
  - eve@0.71.0
  # @truefoundry/trueforge-core@0.1.4 is the exact version @intutic/gate/trueforge's
  # shipped-d.ts verification (embedded TrueForge, Phase 1) was performed
  # against — a devDependency of packages/gate-js only, never a runtime
  # dependency.
  - '@truefoundry/trueforge-core@0.1.4'

# Transitive-only advisories: nothing in this workspace declares these directly,
# so forcing resolution is the only way to take the fix. Pinned to the minimum
# patched version rather than latest, to keep the change as small as the CVE
# requires. Note these live here and not under a "pnpm" key in package.json —
# pnpm 11 silently ignores that field.
#
# vite and esbuild are deliberately absent: vitepress 1.6.4 hard-pins vite ^5.4.14
# and 2.x is alpha-only, so the fix is not reachable. Both advisories are
# dev-server-only, and apps/docs is a private devDependency that builds to static
# HTML in CI — nothing serves the dev server.
#
# (Resolved 2026-07-28: @modelcontextprotocol/sdk moved to ^1.30.0 once it
# cleared the 24h release-age window, taking @hono/node-server to 2.x and
# closing GHSA-frvp-7c67-39w9 without any guard exclusion.)
overrides:
  brace-expansion: '^5.0.12' # CVE-2026-13149, CVE-2026-14257, + the 2026-08 bypass of the 14257 mitigation; GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  fast-uri: '^3.1.6' # CVE-2026-16221, CVE-2026-13676, + host confusion via backslash authority introducer; CVE-2026-75899/75931/75975/76172 (SSRF via repeated hostname / malformed IPv6, host confusion via IDN + percent-encoded scheme)
  js-yaml: '^4.3.2' # CVE-2026-59869, CVE-2026-59870 (quadratic !!omap resolution, unfixed in 4.3.0); CVE-2026-84375 (maxTotalMergeKeys did not bound CPU on empty merge sources)
  # Scoped, not a blanket `nanoid` override: @intutic/control-plane and
  # @intutic/id depend on nanoid v3 directly (CJS, not vulnerable — the GHSA
  # range is >=4.0.0 <5.1.16) and nanoid v4+ is ESM-only, which breaks their
  # CJS build if forced. Only @workflow/core (a transitive of gate-js's
  # `workflow` devDependency, dev-only, added in A3) pulls a vulnerable v5.1.6.
  '@workflow/core>nanoid': '^5.1.16' # GHSA-28wg-ghj8-5hjv (non-secure generator can loop indefinitely on a negative size)
  protobufjs: '^7.6.5' # CVE-2026-59877
  undici: '^7.29.1' # 5 GHSAs newly surfaced by @anthropic-ai/sdk's devDep pulling in `workflow`'s undici transitive at scan time: cross-user cache/cookie/response-desync issues + a parse-time crash; GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3 + 8 lower-severity (fixed in 7.29.1)
  uuid: '^11.1.1' # CVE-2026-41907
  # @modelcontextprotocol/sdk pins hono ^4.11.4 and resolves it to a version
  # below the fix. 4.12.31 satisfies that range, so this needs no SDK bump.
  hono: '^4.13.5' # CVE-2026-59895/6/7, + ReDoS in CORS middleware via Access-Control-Request-Headers; CVE-2026-84363/84364/84365 (query parser past the fragment, unbounded dot-notation nesting in parseBody, toSSG incomplete fix)
  qs: '^6.16.0' # CVE-2026-82417 (DoS via attacker-controlled isBuffer), CVE-2026-82562 (array-limit bypass via bracket-key comma parsing)
  devalue: '^5.9.2' # CVE-2026-81176 (DoS via malformed input)
  '@grpc/grpc-js': '^1.14.5' # GHSA-m9gg-hp2v-232j, GHSA-f596-whhp-79r4 — via @opentelemetry/sdk-node's OTLP gRPC exporters and @a2a-js/sdk
  # Optional dependency of @openai/agents-core (gate-js devDependency, dev-only).
  '@modelcontextprotocol/client': '^2.2.0' # GHSA-6qxp-vccf-f47h
  ip-address: '^10.7.1' # GHSA-2vr4-cq9g-pvrc, GHSA-rpw4-54j3-4h4q, GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv — via express-rate-limit (@modelcontextprotocol/sdk)
  proxy-addr: '^2.0.8' # GHSA-jqcg-44mw-7w3h — via express 5 (@modelcontextprotocol/sdk, @a2a-js/sdk)
  shell-quote: '^1.11.0' # GHSA-pqg4-j6r4-53mv — via @daytona/sdk (gate-js devDependency, dev-only)
  source-map-js: '^1.2.2' # GHSA-68fv-2mgg-jv7q — via postcss and the Vue SFC compiler (build tooling)
  # Direct dependencies too (packages/mcp-proxy, apps/docs), bumped there. The
  # overrides catch the copies other packages resolve on their own:
  # @truefoundry/trueforge-core (gate-js devDependency) keeps the SDK at 1.30.0,
  # and vitepress keeps its own vue (and so @vue/server-renderer) at 3.5.38.
  '@modelcontextprotocol/sdk': '^1.31.0' # GHSA-6qxp-vccf-f47h
  vue: '^3.5.42' # GHSA-g2v6-rqmx-r4w6 (@vue/server-renderer, pinned exactly by vue)
  # `workflow` (gate-js devDependency, dev-only) depends on @workflow/nest,
  # which declares @swc/cli as a required peer, so pnpm auto-installs it.
  # Nothing here uses the NestJS integration (gate-js imports only `workflow`'s
  # main entry) and @workflow/nest never imports @swc/cli. It is the only path
  # to piscina (GHSA-67c8-pqhq-4rmx) and, through @xhmikosr/bin-wrapper -> got
  # -> cacheable-request, to http-cache-semantics (GHSA-ch52-4w7c-c8xp, which
  # has no patched release). Removing the peer removes both.
  '@workflow/nest>@swc/cli': '-'
